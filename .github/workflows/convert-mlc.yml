name: Convert fine-tuned model to MLC

# 为什么要有这个 workflow：
#   本机是 Windows，PyPI 上没有可用的 mlc_llm（`mlc-llm-nightly-cpu` 是个 1.4 KB 空壳包），
#   WSL 被安全策略禁用、也没有 Docker。而 WebLLM 只认 MLC 编译产物，所以转换必须在 Linux 上做。
#   这里借 ubuntu runner 当那台 Linux，产物提交回仓库 model/mlc/ 供 raw.githubusercontent 取用。
#
# 只转权重、配置与 tokenizer 沿用官方目录（理由见 .github/scripts/fix_mlc_config.py 顶部）。

on:
  workflow_dispatch:
  push:
    paths:
      - "model/lora-adapter/**"
      - ".github/workflows/convert-mlc.yml"
      - ".github/scripts/**"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install mlc_llm (diagnostic, never fails)
        run: |
          set -u
          python -m pip install -U pip wheel setuptools
          DIAG=/tmp/mlc_diag.txt
          : > "$DIAG"
          {
            echo "### pip install mlc-llm-nightly-cpu mlc-ai-nightly-cpu"
            python -m pip install --pre -f https://mlc.ai/wheels mlc-llm-nightly-cpu mlc-ai-nightly-cpu 2>&1 || echo "PIP_EXIT=$?"
            echo
            echo "### pip list (mlc / tvm)"
            python -m pip list 2>/dev/null | grep -iE "mlc|tvm" || echo "(none installed)"
            echo
            echo "### import mlc_llm"
            python -c "import mlc_llm; print('IMPORT_OK', getattr(mlc_llm,'__version__','?'))" 2>&1 || echo "IMPORT_FAILED"
            echo
            echo "### 索引里到底有哪些 mlc_llm 轮子（取前 30 行）"
            curl -s --max-time 60 https://mlc.ai/wheels/ | grep -oE 'mlc[_-]llm[_-]nightly[^"<> ]*' | sort -u | head -30 || echo "(索引抓取失败)"
          } >> "$DIAG" 2>&1
          tail -c 6000 "$DIAG"

      - name: Verify mlc_llm usable
        run: python -c "import mlc_llm; print('mlc_llm ok', getattr(mlc_llm,'__version__','?'))"

      - name: Install deps for LoRA merge
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers peft safetensors sentencepiece protobuf

      - name: Merge LoRA into base
        run: python .github/scripts/merge_lora.py "Qwen/Qwen2-0.5B-Instruct" "model/lora-adapter" "merged"

      - name: Convert weights to q4f16_1
        run: |
          mlc_llm convert_weight ./merged --quantization q4f16_1 -o dist/tuned
          ls -la dist/tuned
          du -sh dist/tuned

      - name: Reuse official config and tokenizer
        run: python .github/scripts/fix_mlc_config.py "dist/tuned"

      - name: Sanity check output
        run: |
          test -f dist/tuned/mlc-chat-config.json
          test -f dist/tuned/ndarray-cache.json
          ls dist/tuned/params_shard_*.bin | wc -l
          du -sh dist/tuned

      - name: Dump diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p model
          {
            echo "# 转换诊断（CI 自动生成，可删）"
            echo
            echo "run id: $GITHUB_RUN_ID"
            echo
            echo '```'
            cat /tmp/mlc_diag.txt 2>/dev/null || echo "(无诊断文件：卡在第一步之前)"
            echo '```'
          } > model/diag.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/diag.md
          git diff --cached --quiet || { git commit -m "chore(model): 记录转换诊断 [skip ci]"; git push; }

      - name: Commit converted model back to repo
        if: success()
        run: |
          rm -rf model/mlc
          mkdir -p model
          cp -r dist/tuned model/mlc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/mlc
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "chore(model): convert fine-tuned model to MLC q4f16_1 [skip ci]"
            git push
          fi
