name: Convert fine-tuned model to MLC

# 目标：把 model/lora-adapter/（后训练 LoRA，加负样本版，有害错误率 9.6%）
#      合并进 Qwen2-0.5B-Instruct 基座，再转成 WebLLM 可加载的 MLC q4f16_1 产物，
#      产物直接提交回 model/mlc/（每个分片 ~48 MB，单文件 < GitHub 100 MB 限制）。
#
# 为什么在 CI 做（2026-11-02 重新启用）：
#   · 本机 Windows 的 mlc_llm 只有 0.26.dev20，而 mlc.ai 的 win tvm 只有 0.26.dev529 → API 不匹配，import 即崩
#   · 本机 WSL 的 LxssManager 反复卡在 StopPending（多次实测），不能作为可靠执行环境
#   · 之前 CI 失败是「两个 nightly 包版本不一致」（mlc_llm 0.26.dev6 + mlc_ai 0.26.dev246）
#     → 这次改用**稳定发行版配对**：mlc_llm_cpu-0.20.0.dev0 + mlc_ai_cpu-0.20.0（同一发行批次）
#   并且**按 wheel 直链安装**：PyPI 上有同名空壳包（1.4 KB），用 `-f/--find-links` 会静默装错。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "model/lora-adapter/**"
      - ".github/workflows/convert-mlc.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install mlc_llm (stable pair, direct wheel URLs)
        run: |
          set -eux
          python -m pip install -U pip wheel setuptools
          # mlc.ai/wheels 的索引里，条目 href 指向 GitHub Release（v0.9.dev0），
          # 不是 https://mlc.ai/wheels/<file>（直链会 404，第一次就是这样失败的）
          W=https://github.com/mlc-ai/package/releases/download/v0.9.dev0
          python -m pip install \
            "$W/mlc_ai_cpu-0.20.0-py3-none-manylinux_2_28_x86_64.whl" \
            "$W/mlc_llm_cpu-0.20.0.dev0-py3-none-manylinux_2_28_x86_64.whl" \
            psutil 2>&1 | tee /tmp/install.log | tail -20
          python -m pip list | grep -iE "mlc|tvm" || true
          python -c "import mlc_llm, tvm; print('IMPORT_OK tvm', tvm.__version__)" 2>&1 | tee /tmp/import.log | tail -5

      - name: Install merge deps (CPU torch)
        run: |
          set -eux
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install transformers peft safetensors

      - name: Merge LoRA into base (Qwen2-0.5B-Instruct)
        run: |
          set -eux
          python - <<'PY'
          import torch, json, os
          from transformers import AutoModelForCausalLM, AutoTokenizer
          from peft import PeftModel
          base_id = "Qwen/Qwen2-0.5B-Instruct"
          out = "/tmp/merged"
          tok = AutoTokenizer.from_pretrained(base_id)
          model = AutoModelForCausalLM.from_pretrained(base_id, torch_dtype=torch.float32)
          model = PeftModel.from_pretrained(model, "model/lora-adapter")
          model = model.merge_and_unload()
          model.save_pretrained(out, safe_serialization=True, max_shard_size="2GB")
          tok.save_pretrained(out)
          # transformers 5.x 把 rope_theta 挪进 rope_parameters，mlc_llm 按 v4 读 → TypeError
          p = os.path.join(out, "config.json")
          cfg = json.load(open(p))
          rp = cfg.get("rope_parameters") or {}
          cfg.setdefault("rope_theta", rp.get("rope_theta", 1000000.0))
          if "torch_dtype" not in cfg and "dtype" in cfg:
              cfg["torch_dtype"] = cfg["dtype"]
          json.dump(cfg, open(p, "w"), ensure_ascii=False, indent=2)
          print("rope_theta =", cfg["rope_theta"], "| torch_dtype =", cfg.get("torch_dtype"))
          print("files:", sorted(os.listdir(out)))
          PY

      - name: Convert weights (q4f16_1)
        run: |
          set -uo pipefail
          rm -rf model/mlc
          if command -v mlc_llm >/dev/null 2>&1; then MLC="mlc_llm"; else MLC="python -m mlc_llm"; fi
          echo "using: $MLC"
          { $MLC convert_weight --help 2>&1 | head -40; } > /tmp/convert.log || true
          $MLC convert_weight /tmp/merged --quantization q4f16_1 -o model/mlc 2>&1 | tee -a /tmp/convert.log | tail -40
          st=${PIPESTATUS[0]}
          echo "convert_exit=$st"
          [ "$st" = "0" ] || exit "$st"
          du -sh model/mlc
          ls model/mlc

      - name: Copy official config + tokenizer (reuse prebuilt wasm model_lib)
        run: |
          set -eux
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from huggingface_hub import snapshot_download
          out = Path("model/mlc")
          src = snapshot_download("mlc-ai/Qwen2-0.5B-Instruct-q4f16_1-MLC", allow_patterns=["*.json", "*.txt"])
          for f in ["mlc-chat-config.json", "tokenizer.json", "tokenizer_config.json", "vocab.json", "merges.txt"]:
              s = os.path.join(src, f)
              if os.path.exists(s):
                  shutil.copy(s, out / f)
          p = out / "mlc-chat-config.json"
          cfg = json.loads(p.read_text())
          cfg.update({"temperature": 0.0, "top_p": 1.0, "repetition_penalty": 1.0})
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2))
          print("model_type=%s quant=%s ctx=%s" % (cfg.get("model_type"), cfg.get("quantization"), cfg.get("context_window_size")))
          PY

      - name: Verify artifacts
        run: |
          set -eux
          n=$(ls model/mlc/params_shard_*.bin 2>/dev/null | wc -l)
          echo "shards: $n"
          test "$n" -ge 1
          du -sh model/mlc
          find model/mlc -type f -size +99M -print | head

      - name: Commit artifacts
        if: success()
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f model/mlc
          git commit -m "chore(model): 后训练模型转为 MLC q4f16_1（CI 稳定版配对）[skip ci]" || echo "nothing to commit"
          git push

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set -u
          {
            echo "### 失败时间 $(date -u)"
            echo
            echo "#### pip install 输出（末尾 60 行）"
            echo '```'
            tail -60 /tmp/install.log 2>/dev/null || echo "(无 /tmp/install.log)"
            echo '```'
            echo
            echo "#### import mlc_llm 输出"
            echo '```'
            cat /tmp/import.log 2>/dev/null || echo "(无 /tmp/import.log)"
            echo '```'
            echo
            echo "#### convert_weight 输出（末尾 120 行，含 --help）"
            echo '```'
            tail -120 /tmp/convert.log 2>/dev/null || echo "(无 /tmp/convert.log)"
            echo '```'
            echo
            echo "#### 合并后的模型目录"
            echo '```'
            ls -la /tmp/merged 2>/dev/null | head -20 || true
            echo '```'
            echo
            echo "#### 已安装版本"
            echo '```'
            python -m pip list 2>/dev/null | grep -iE "mlc|tvm|torch|transformers|peft" || true
            echo '```'
          } > model/diag.md 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model/diag.md
          git commit -m "chore(model): 转换失败诊断 [skip ci]" || true
          git push || true
